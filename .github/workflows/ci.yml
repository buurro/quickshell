name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check formatting (alejandra)
        run: nix run nixpkgs#alejandra -- --check .

      - name: Check flake evaluates
        run: nix flake check

  test-template:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test template
        run: |
          cd templates/default
          nix flake check
          nix build .#ci || true  # ci is linux-only

          # Test dev script
          nix build .#dev
          echo "--- dev script ---"
          head -20 result/bin/dev
          grep -q '#!/usr/bin/env bash' result/bin/dev
          grep -q 'jq' result/bin/dev

          # Test single-line comment
          nix build .#with-comment
          echo "--- with-comment script ---"
          head -10 result/bin/with-comment
          grep -q '# This is a dev environment' result/bin/with-comment

          # Test multiline comment
          nix build .#with-multiline-comment
          echo "--- multiline comment script ---"
          head -10 result/bin/with-multiline-comment
          grep -q '# Development environment' result/bin/with-multiline-comment
          grep -q '# Created by quickshell' result/bin/with-multiline-comment

          # Test dangerous characters are safely commented
          nix build .#with-dangerous-comment
          echo "--- dangerous comment script ---"
          head -10 result/bin/with-dangerous-comment
          grep -q '# Test: \$(whoami)' result/bin/with-dangerous-comment
          grep -q "# Quotes:" result/bin/with-dangerous-comment
          bash -n result/bin/with-dangerous-comment

          echo "All tests passed!"
